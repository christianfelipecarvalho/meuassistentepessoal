<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="#10b981"/>
  
  <!-- Safe zone (80% of size) to prevent cropping -->
  <g transform="translate(19.2, 19.2) scale(0.8)">
    <!-- White background circle for safe area -->
    <circle cx="96" cy="96" r="76" fill="white"/>
    
    <!-- Dollar sign -->
    <text x="96" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#10b981">$</text>
  </g>
</svg>
