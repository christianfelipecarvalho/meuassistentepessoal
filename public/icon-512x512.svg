<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="#10b981"/>
  
  <!-- Safe zone (80% of size) to prevent cropping -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- White background circle for safe area -->
    <circle cx="256" cy="256" r="200" fill="white"/>
    
    <!-- Dollar sign -->
    <text x="256" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="320" font-weight="bold" fill="#10b981">$</text>
  </g>
</svg>
